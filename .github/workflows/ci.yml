name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-checks:
    name: Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify module checksums
        run: go mod verify

      - name: Provision bubblewrap userns isolation (direct backend)
        # Phase 07-03: direct-mode stage-2 exec requires bwrap --unshare-net
        # on Linux; without userns those runs honestly degrade to
        # StatusUnavailable (REDUCED-GUARANTEE) instead of executing on host
        # network. Provision the CT-target capability here so the suite
        # exercises the wrapped path. The trailing probe fails the step
        # loudly if userns cannot be enabled.
        run: |
          sudo apt-get update -y
          sudo apt-get install -y bubblewrap uidmap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          unshare -Urn true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race -count=1 -timeout=5m ./...
